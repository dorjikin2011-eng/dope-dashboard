<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Activity — DoPE Dashboard</title>
<style>
  :root {
    --purple:#534AB7; --purple-light:#EEEDFE;
    --teal:#1D9E75;   --teal-light:#E1F5EE;
    --blue:#378ADD;   --blue-light:#E6F1FB;
    --green:#639922;  --green-light:#EAF3DE;
    --amber:#BA7517;  --amber-light:#FAEEDA;
    --red:#A32D2D;    --red-light:#FCEBEB;
    --gray:#5F5E5A;   --gray-light:#F1EFE8;
    --text:#2C2C2A;   --text-muted:#5F5E5A;
    --border:rgba(0,0,0,0.12);
    --bg:#F6F5F0;     --card:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;}

  nav{background:var(--purple);color:#fff;padding:0 24px;height:52px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;}
  nav .brand{font-weight:600;font-size:15px;}
  nav .brand span{opacity:.7;font-weight:400;margin-left:8px;font-size:13px;}
  nav .nav-links{display:flex;gap:6px;}
  nav a{color:rgba(255,255,255,.85);text-decoration:none;padding:6px 14px;
    border-radius:6px;font-size:13px;transition:background .15s;}
  nav a:hover{background:rgba(255,255,255,.18);color:#fff;}

  .page{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
  .breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:18px;}
  .breadcrumb a{color:var(--purple);text-decoration:none;}
  .breadcrumb a:hover{text-decoration:underline;}

  /* ACTIVITY HEADER */
  .act-header{background:var(--card);border:0.5px solid var(--border);
    border-radius:var(--radius);padding:20px 24px;margin-bottom:22px;
    border-left:4px solid var(--purple);}
  .act-header .top{display:flex;justify-content:space-between;
    align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .act-header h1{font-size:18px;font-weight:700;line-height:1.3;}
  .act-header .meta{font-size:12px;color:var(--text-muted);margin-top:3px;}
  .act-header .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .badge{display:inline-block;font-size:12px;padding:4px 12px;
    border-radius:20px;font-weight:500;white-space:nowrap;}
  .badge.Completed {background:var(--green-light);color:var(--green);}
  .badge.Ongoing   {background:var(--amber-light); color:var(--amber);}
  .badge.Delayed   {background:var(--red-light);   color:var(--red);}
  .badge.Not\ Started{background:var(--gray-light);color:var(--gray);}
  .act-stats{display:flex;gap:24px;flex-wrap:wrap;}
  .act-stat .l{font-size:11px;color:var(--text-muted);}
  .act-stat .v{font-size:15px;font-weight:600;margin-top:1px;}
  .act-stat .v.over{color:var(--red);}
  .bar-track{background:var(--gray-light);border-radius:6px;height:7px;
    overflow:hidden;margin-top:10px;max-width:300px;}
  .bar-fill{height:100%;border-radius:6px;background:var(--teal);transition:width .5s;}

  /* TABS */
  .tabs{display:flex;gap:4px;margin-bottom:0;border-bottom:2px solid var(--border);}
  .tab{padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;
    border:none;background:none;color:var(--text-muted);
    border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--purple);border-bottom-color:var(--purple);}
  .tab-panel{display:none;padding-top:20px;}
  .tab-panel.active{display:block;}

  /* TOOLBAR */
  .toolbar{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .toolbar h2{font-size:15px;font-weight:600;margin:0;}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;
    border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
    border:none;transition:opacity .15s;}
  .btn:hover{opacity:.85;}
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-outline{background:#fff;color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--red-light);color:var(--red);border:1px solid var(--red-light);}

  /* TABLE */
  .table-wrap{background:var(--card);border:0.5px solid var(--border);
    border-radius:var(--radius);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead tr{background:var(--gray-light);}
  th{padding:9px 12px;text-align:left;font-weight:600;font-size:12px;
    color:var(--text-muted);white-space:nowrap;}
  td{padding:9px 12px;border-top:0.5px solid var(--border);vertical-align:middle;}
  .clickable tr[data-id]:hover td{background:var(--blue-light);cursor:pointer;}
  .amount{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .empty{text-align:center;padding:32px;color:var(--text-muted);font-size:13px;}
  .loading{text-align:center;padding:32px;color:var(--text-muted);}
  .err-box{background:var(--red-light);color:var(--red);border-radius:8px;
    padding:12px 16px;font-size:13px;margin-bottom:14px;}

  /* TOTALS ROW */
  .totals-row td{font-weight:600;background:var(--gray-light);border-top:2px solid var(--border);}

  /* AUDIT LOG */
  .log-entry{background:var(--card);border:0.5px solid var(--border);
    border-radius:8px;padding:12px 16px;margin-bottom:8px;font-size:13px;}
  .log-entry .log-top{display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:4px;margin-bottom:4px;}
  .log-entry .who{font-weight:600;color:var(--purple);}
  .log-entry .when{font-size:12px;color:var(--text-muted);}
  .log-entry .field{color:var(--text-muted);font-size:12px;}
  .log-entry .change{margin-top:3px;}
  .log-entry .old{color:var(--red);text-decoration:line-through;margin-right:6px;}
  .log-entry .new{color:var(--green);font-weight:500;}

  /* EDIT ACTIVITY FORM */
  .form-card{background:var(--card);border:0.5px solid var(--border);
    border-radius:var(--radius);padding:22px 24px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);
    margin-bottom:4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);
    border-radius:7px;font-size:13px;font-family:inherit;
    background:#fff;color:var(--text);outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--purple);
    box-shadow:0 0 0 3px var(--purple-light);}
  textarea{resize:vertical;min-height:60px;}
  .required{color:var(--red);}
  .hint{font-size:11px;color:var(--text-muted);margin-top:3px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* SESSION MODAL */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);
    z-index:200;align-items:center;justify-content:center;padding:16px;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:620px;
    max-height:92vh;overflow-y:auto;padding:26px;position:relative;}
  .modal h3{font-size:16px;margin-bottom:18px;}
  .modal-close{position:absolute;top:16px;right:18px;background:none;border:none;
    font-size:20px;cursor:pointer;color:var(--text-muted);}
  .modal-close:hover{color:var(--text);}
  .inline-err{color:var(--red);font-size:12px;margin-top:14px;display:none;}

  @media(max-width:660px){
    .form-grid{grid-template-columns:1fr;}
    .form-grid .full{grid-column:1;}
    .act-stats{gap:14px;}
  }
</style>
</head>
<body>

<nav>
  <div class="brand">ACC · DoPE <span>Performance Dashboard FY 2026–2027</span></div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="reports.html">Reports</a>
  </div>
</nav>

<div class="page">
  <div class="breadcrumb" id="breadcrumb">
    <a href="index.html">Home</a> ›
    <a href="#" id="bc-div">Division</a> ›
    <span id="bc-act">Activity</span>
  </div>

  <!-- ACTIVITY HEADER -->
  <div class="act-header" id="act-header">
    <div class="loading">Loading…</div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="sessions">Sessions</button>
    <button class="tab" data-tab="log">Update log</button>
    <button class="tab" data-tab="edit">Edit activity</button>
  </div>

  <!-- TAB: SESSIONS -->
  <div class="tab-panel active" id="tab-sessions">
    <div class="toolbar">
      <h2>Sessions</h2>
      <button class="btn btn-primary" id="btn-add-session">＋ Add session</button>
    </div>
    <div class="err-box" id="sess-err" style="display:none"></div>
    <div class="table-wrap">
      <table class="clickable">
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>Venue / place</th>
            <th>Target audience</th>
            <th>Duration</th>
            <th>Male</th>
            <th>Female</th>
            <th>Total</th>
            <th>Expenditure (Nu.)</th>
            <th>Remarks</th>
            <th>Entered by</th>
          </tr>
        </thead>
        <tbody id="sess-body">
          <tr><td colspan="11" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB: UPDATE LOG -->
  <div class="tab-panel" id="tab-log">
    <div class="toolbar"><h2>Update log</h2></div>
    <div id="log-list"><div class="loading">Loading…</div></div>
  </div>

  <!-- TAB: EDIT ACTIVITY -->
  <div class="tab-panel" id="tab-edit">
    <div class="form-card">
      <div class="form-grid">
        <div class="full">
          <label>Activity name <span class="required">*</span></label>
          <input id="e-name" type="text"/>
        </div>
        <div class="full">
          <label>Performance target</label>
          <input id="e-target" type="text"/>
        </div>
        <div>
          <label>Budget allocated (Nu.) <span class="required">*</span></label>
          <input id="e-budget" type="number" min="0"/>
        </div>
        <div>
          <label>Expected completion</label>
          <input id="e-expected" type="month"/>
        </div>
        <div>
          <label>Status <span class="required">*</span></label>
          <select id="e-status">
            <option>Not Started</option>
            <option>Ongoing</option>
            <option>Completed</option>
            <option>Delayed</option>
          </select>
        </div>
        <div>
          <label>Updated by <span class="required">*</span></label>
          <input id="e-updatedby" type="text" placeholder="Your name"/>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="btn-save-edit">Save changes</button>
      </div>
    </div>
  </div>
</div>

<!-- SESSION MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h3 id="modal-title">Add session</h3>
    <div class="form-grid">

      <div>
        <label>Date <span class="required">*</span></label>
        <input id="s-date" type="date"/>
      </div>
      <div>
        <label>Duration</label>
        <input id="s-duration" type="text" placeholder="e.g. 3 hours, 1 day"/>
      </div>

      <div>
        <label>Venue name</label>
        <input id="s-venue" type="text" placeholder="e.g. ACC Conference Hall"/>
      </div>
      <div>
        <label>Place / address</label>
        <input id="s-place" type="text" placeholder="e.g. Thimphu, Bhutan"/>
      </div>

      <div class="full">
        <label>Target audience</label>
        <input id="s-audience" type="text" placeholder="e.g. Civil servants, students, local govt. staff"/>
      </div>

      <div>
        <label>No. of participants (total) <span class="required">*</span></label>
        <input id="s-total" type="number" min="0" placeholder="0"/>
      </div>
      <div></div>

      <div>
        <label>Male <span class="required">*</span></label>
        <input id="s-male" type="number" min="0" placeholder="0"/>
      </div>
      <div>
        <label>Female <span class="required">*</span></label>
        <input id="s-female" type="number" min="0" placeholder="0"/>
        <div class="hint">Male + Female must equal Total</div>
      </div>

      <div>
        <label>Expenditure (Nu.) <span class="required">*</span></label>
        <input id="s-exp" type="number" min="0" placeholder="0"/>
      </div>
      <div>
        <label>Entered by <span class="required">*</span></label>
        <input id="s-by" type="text" placeholder="Your name"/>
      </div>

      <div class="full">
        <label>Remarks</label>
        <textarea id="s-remarks" placeholder="Optional notes about this session"></textarea>
      </div>
    </div>
    <div class="inline-err" id="modal-err"></div>
    <div class="form-actions">
      <button class="btn btn-outline" id="btn-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-save-session">Save session</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──
const SUPA_URL = 'https://fiozcsxlnpvphrxwvzzy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpb3pjc3hsbnB2cGhyeHd2enp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzkxNTYsImV4cCI6MjA5NjY1NTE1Nn0.1XZn61C23mE5LkltAC1VU57-iWySlJsy1_9-ZRAW1I8';

const actId = new URLSearchParams(location.search).get('id');
let activity = null;
let sessions = [];
let editingSessionId = null;

// ── HELPERS ──
function fmt(n){ return Number(n || 0).toFixed(3); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtTs(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function showSessErr(m){ const e=document.getElementById('sess-err'); e.textContent=m; e.style.display=m?'block':'none'; }
function showModalErr(m){ const e=document.getElementById('modal-err'); e.textContent=m; e.style.display=m?'block':'none'; }

async function api(method, path, body){
  const r = await fetch(SUPA_URL+path,{
    method,
    headers:{
      apikey:SUPA_KEY, Authorization:'Bearer '+SUPA_KEY,
      'Content-Type':'application/json',
      Prefer: method==='POST'?'return=representation':''
    },
    body: body?JSON.stringify(body):undefined
  });
  const txt = await r.text();
  if(!r.ok) throw new Error(txt);
  return txt?JSON.parse(txt):null;
}

// ── TABS ──
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='log') loadLog();
  });
});

// ── LOAD ──
async function load(){
  if(!actId){ document.getElementById('act-header').innerHTML='<div class="err-box">No activity specified.</div>'; return; }
  try {
    const [actRows, sessRows] = await Promise.all([
      api('GET',`/rest/v1/v_activity_detail?select=*&id=eq.${actId}`),
      api('GET',`/rest/v1/sessions?select=*&activity_id=eq.${actId}&order=session_date.asc`)
    ]);
    activity = actRows[0];
    sessions = sessRows || [];
    renderHeader();
    renderSessions();
    populateEditForm();
  } catch(e){
    showSessErr('Error loading: '+e.message);
  }
}

// ── HEADER ──
function renderHeader(){
  const a = activity;
  if(!a){ document.getElementById('act-header').innerHTML='<div class="err-box">Activity not found.</div>'; return; }
  document.title = a.name+' — DoPE Dashboard';
  document.getElementById('bc-div').textContent = a.division_code;
  document.getElementById('bc-div').href = `division.html?div=${a.division_code}`;
  document.getElementById('bc-act').textContent = a.name;
  const actual  = +a.total_actual||0;
  const budget  = +a.budget_allocated||0;
  const balance = budget-actual;
  const pct     = budget>0?Math.min(Math.round(actual/budget*100),100):0;
  document.getElementById('act-header').innerHTML = `
    <div class="top">
      <div>
        <h1>${a.name}</h1>
        <div class="meta">${a.division_code} · ${a.division_name}${a.target?' · Target: '+a.target:''}</div>
      </div>
      <div class="right">
        <span class="badge ${a.status}">${a.status}</span>
      </div>
    </div>
    <div class="act-stats">
      <div class="act-stat"><div class="l">Budget (Nu.)</div><div class="v">Nu. ${fmt(budget)}</div></div>
      <div class="act-stat"><div class="l">Actual spent (Nu.)</div><div class="v">Nu. ${fmt(actual)}</div></div>
      <div class="act-stat"><div class="l">Balance (Nu.)</div><div class="v ${balance<0?'over':''}">Nu. ${fmt(balance)}</div></div>
      <div class="act-stat"><div class="l">Sessions</div><div class="v">${a.session_count||0}</div></div>
      <div class="act-stat"><div class="l">Total participants</div><div class="v">${fmt(a.total_participants)}</div></div>
      <div class="act-stat"><div class="l">Male / Female</div><div class="v">${fmt(a.total_male)} / ${fmt(a.total_female)}</div></div>
      ${a.expected_date?`<div class="act-stat"><div class="l">Expected completion</div><div class="v">${a.expected_date.slice(0,7)}</div></div>`:''}
    </div>
    <div class="bar-track" style="margin-top:14px">
      <div class="bar-fill" style="width:${pct}%"></div>
    </div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:4px">${pct}% of budget utilised</div>`;
}

// ── SESSIONS TABLE ──
function renderSessions(){
  const tb = document.getElementById('sess-body');
  if(!sessions.length){
    tb.innerHTML=`<tr><td colspan="11" class="empty">No sessions yet. Click "＋ Add session" to record one.</td></tr>`;
    return;
  }
  let totM=0,totF=0,totP=0,totExp=0;
  sessions.forEach(s=>{ totM+=+s.participants_male; totF+=+s.participants_female; totP+=+s.participants_total; totExp+=+s.expenditure; });
  tb.innerHTML = sessions.map((s,i)=>`
    <tr data-id="${s.id}">
      <td>${i+1}</td>
      <td style="white-space:nowrap">${fmtDate(s.session_date)}</td>
      <td>${[s.venue,s.place_address].filter(Boolean).join(', ')||'—'}</td>
      <td>${s.target_audience||'—'}</td>
      <td>${s.duration||'—'}</td>
      <td>${fmt(s.participants_male)}</td>
      <td>${fmt(s.participants_female)}</td>
      <td><strong>${fmt(s.participants_total)}</strong></td>
      <td class="amount">Nu. ${fmt(s.expenditure)}</td>
      <td style="max-width:160px;white-space:normal">${s.remarks||'—'}</td>
      <td>${s.entered_by}</td>
    </tr>`).join('')+`
    <tr class="totals-row">
      <td colspan="5">Totals</td>
      <td>${fmt(totM)}</td>
      <td>${fmt(totF)}</td>
      <td>${fmt(totP)}</td>
      <td class="amount">Nu. ${fmt(totExp)}</td>
      <td colspan="2"></td>
    </tr>`;

  tb.querySelectorAll('tr[data-id]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const s = sessions.find(x=>x.id==tr.dataset.id);
      openSessionModal(s);
    });
  });
}

// ── AUDIT LOG ──
async function loadLog(){
  const el = document.getElementById('log-list');
  el.innerHTML='<div class="loading">Loading…</div>';
  try {
    const rows = await api('GET',`/rest/v1/audit_log?select=*&activity_id=eq.${actId}&order=updated_at.desc`);
    if(!rows.length){ el.innerHTML='<div class="empty" style="padding:24px;color:var(--text-muted)">No updates recorded yet.</div>'; return; }
    el.innerHTML = rows.map(r=>`
      <div class="log-entry">
        <div class="log-top">
          <span class="who">${r.updated_by}</span>
          <span class="when">${fmtTs(r.updated_at)}</span>
        </div>
        <div class="field">${r.field_changed}</div>
        <div class="change">
          ${r.old_value?`<span class="old">${r.old_value}</span>`:''}
          <span class="new">${r.new_value||'—'}</span>
        </div>
      </div>`).join('');
  } catch(e){
    el.innerHTML=`<div class="err-box">Error: ${e.message}</div>`;
  }
}

// ── EDIT ACTIVITY FORM ──
function populateEditForm(){
  const a = activity;
  if(!a) return;
  document.getElementById('e-name').value     = a.name||'';
  document.getElementById('e-target').value   = a.target||'';
  document.getElementById('e-budget').value   = a.budget_allocated||'';
  document.getElementById('e-expected').value = a.expected_date?a.expected_date.slice(0,7):'';
  document.getElementById('e-status').value   = a.status||'Not Started';
}

document.getElementById('btn-save-edit').addEventListener('click', async ()=>{
  const name      = document.getElementById('e-name').value.trim();
  const budget    = document.getElementById('e-budget').value.trim();
  const updatedby = document.getElementById('e-updatedby').value.trim();
  const status    = document.getElementById('e-status').value;
  if(!name)      { alert('Activity name is required.'); return; }
  if(!budget)    { alert('Budget is required.'); return; }
  if(!updatedby) { alert('Please enter your name.'); return; }

  const payload = {
    name,
    target:           document.getElementById('e-target').value.trim()||null,
    budget_allocated: parseFloat(budget),
    expected_date:    document.getElementById('e-expected').value||null,
    status,
  };
  const btn = document.getElementById('btn-save-edit');
  btn.textContent='Saving…'; btn.disabled=true;
  try {
    await api('PATCH',`/rest/v1/activities?id=eq.${actId}`,payload);
    // Audit log
    const fields=[['name','Name'],['target','Target'],['budget_allocated','Budget'],['expected_date','Expected date'],['status','Status']];
    for(const [f,lbl] of fields){
      const oldVal=String(activity[f]??'');
      const newVal=String(payload[f]??'');
      if(oldVal!==newVal){
        await api('POST','/rest/v1/audit_log',{
          activity_id:  +actId,
          field_changed: lbl,
          old_value:    oldVal,
          new_value:    newVal,
          updated_by:   updatedby,
        });
      }
    }
    await load();
    alert('Activity updated successfully.');
  } catch(e){ alert('Save failed: '+e.message); }
  finally{ btn.textContent='Save changes'; btn.disabled=false; }
});

// ── SESSION MODAL ──
function openSessionModal(sess){
  editingSessionId = sess?sess.id:null;
  document.getElementById('modal-title').textContent = sess?'Edit session':'Add session';
  document.getElementById('s-date').value     = sess?.session_date||'';
  document.getElementById('s-duration').value = sess?.duration||'';
  document.getElementById('s-venue').value    = sess?.venue||'';
  document.getElementById('s-place').value    = sess?.place_address||'';
  document.getElementById('s-audience').value = sess?.target_audience||'';
  document.getElementById('s-total').value    = sess?.participants_total||'';
  document.getElementById('s-male').value     = sess?.participants_male||'';
  document.getElementById('s-female').value   = sess?.participants_female||'';
  document.getElementById('s-exp').value      = sess?.expenditure||'';
  document.getElementById('s-by').value       = sess?.entered_by||'';
  document.getElementById('s-remarks').value  = sess?.remarks||'';
  showModalErr('');
  document.getElementById('overlay').classList.add('open');
  document.getElementById('s-date').focus();
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); editingSessionId=null; }

document.getElementById('btn-add-session').addEventListener('click',()=>openSessionModal(null));
document.getElementById('btn-cancel').addEventListener('click',closeModal);
document.getElementById('modal-close').addEventListener('click',closeModal);
document.getElementById('overlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });

// Auto-compute total from male+female
['s-male','s-female'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    const m=+document.getElementById('s-male').value||0;
    const f=+document.getElementById('s-female').value||0;
    document.getElementById('s-total').value = m+f;
  });
});

// ── SAVE SESSION ──
document.getElementById('btn-save-session').addEventListener('click', async ()=>{
  const date   = document.getElementById('s-date').value;
  const total  = parseInt(document.getElementById('s-total').value)||0;
  const male   = parseInt(document.getElementById('s-male').value)||0;
  const female = parseInt(document.getElementById('s-female').value)||0;
  const exp    = parseFloat(document.getElementById('s-exp').value)||0;
  const by     = document.getElementById('s-by').value.trim();

  if(!date)        { showModalErr('Date is required.'); return; }
  if(!by)          { showModalErr('Please enter your name.'); return; }
  if(total<=0)     { showModalErr('Total participants must be greater than 0.'); return; }
  if(male+female !== total){ showModalErr(`Male (${male}) + Female (${female}) must equal Total (${total}).`); return; }
  if(exp<0)        { showModalErr('Expenditure cannot be negative.'); return; }

  const payload = {
    activity_id:         +actId,
    session_date:        date,
    duration:            document.getElementById('s-duration').value.trim()||null,
    venue:               document.getElementById('s-venue').value.trim()||null,
    place_address:       document.getElementById('s-place').value.trim()||null,
    target_audience:     document.getElementById('s-audience').value.trim()||null,
    participants_total:  total,
    participants_male:   male,
    participants_female: female,
    expenditure:         exp,
    remarks:             document.getElementById('s-remarks').value.trim()||null,
    entered_by:          by,
  };

  const btn = document.getElementById('btn-save-session');
  btn.textContent='Saving…'; btn.disabled=true;
  showModalErr('');

  try {
    if(editingSessionId){
      await api('PATCH',`/rest/v1/sessions?id=eq.${editingSessionId}`,payload);
      await api('POST','/rest/v1/audit_log',{
        activity_id:  +actId,
        session_id:   editingSessionId,
        field_changed:'Session updated',
        old_value:    null,
        new_value:    `Session on ${fmtDate(date)}`,
        updated_by:   by,
      });
    } else {
      const created = await api('POST','/rest/v1/sessions',payload);
      await api('POST','/rest/v1/audit_log',{
        activity_id:  +actId,
        session_id:   created[0].id,
        field_changed:'Session added',
        old_value:    null,
        new_value:    `Session on ${fmtDate(date)} · ${total} participants · Nu. ${fmt(exp)}`,
        updated_by:   by,
      });
    }
    closeModal();
    await load();
  } catch(e){ showModalErr('Save failed: '+e.message); }
  finally{ btn.textContent='Save session'; btn.disabled=false; }
});

load();
</script>
</body>
</html>
