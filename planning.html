<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quarterly Planning — DoPE Dashboard</title>
<style>
  :root { 
    --purple:#534AB7; --teal:#1D9E75; --blue:#378ADD; --bg:#F6F5F0; 
    --card:#FFFFFF; --border:rgba(0,0,0,0.12); --radius:10px; 
    --text:#2C2C2A; --text-muted:#5F5E5A; --gray-light:#F1EFE8;
  }
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;}
  nav{background:var(--purple);color:#fff;padding:0 24px;height:52px; display:flex;align-items:center;justify-content:space-between;}
  .nav-links a{color:rgba(255,255,255,.85);text-decoration:none;padding:6px 14px; border-radius:6px;font-size:13px;}
  .nav-links a.active{background:rgba(255,255,255,.18);color:#fff;}
  .page{max-width:1100px;margin:0 auto;padding:28px 20px;}
  .table-wrap{background:var(--card);border:0.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{padding:12px;background:var(--gray-light);text-align:left;font-weight:600;color:var(--text-muted);}
  td{padding:12px;border-top:0.5px solid var(--border);}
  .status-badge{padding:4px 8px;border-radius:4px;border:1px solid var(--border);font-size:12px;}
</style>
</head>
<body>

<nav>
  <div class="brand">ACC · DoPE <span>Quarterly Planning</span></div>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="planning.html" class="active">Planning</a>
  </div>
</nav>

<div class="page">
  <div class="section">
    <h2>Quarterly KPI Targets</h2>
    <div class="filter-bar" style="background:#fff; padding:12px; border:0.5px solid #ccc; border-radius:10px 10px 0 0; display:flex; gap:10px; margin-bottom:0;">
      <select id="f-div" onchange="loadPlans()">
        <option value="ADMD">ADMD</option><option value="EAD">EAD</option>
        <option value="ED">ED</option><option value="PD">PD</option>
      </select>
      <select id="f-qtr" onchange="loadPlans()">
        <option value="Q1">Q1</option><option value="Q2">Q2</option>
        <option value="Q3">Q3</option><option value="Q4">Q4</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>KPI Name</th><th>Type</th><th>Target / Progress</th><th>Status</th></tr>
        </thead>
        <tbody id="plan-body">
          <tr><td colspan="4" style="text-align:center; padding:20px;">Loading plans…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const SUPA_URL = 'https://fiozcsxlnpvphrxwvzzy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZpb3pjc3hsbnB2cGhyeHd2enp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzkxNTYsImV4cCI6MjA5NjY1NTE1Nn0.1XZn61C23mE5LkltAC1VU57-iWySlJsy1_9-ZRAW1I8';

async function loadPlans() {
  const div = document.getElementById('f-div').value;
  const qtr = document.getElementById('f-qtr').value;
  const tbody = document.getElementById('plan-body');
  
  try {
    const res = await fetch(`${SUPA_URL}/rest/v1/quarterly_plans?division_code=eq.${div}&quarter=eq.${qtr}`, {
      headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY }
    });
    const data = await res.json();
    
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center">No plans found.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(p => `
      <tr>
        <td>${p.kpi_name}</td>
        <td>${p.kpi_type}</td>
        <td>
          ${p.kpi_type === 'quantitative' 
            ? `<input type="number" value="${p.target_value||0}" onchange="updatePlan('${p.id}', this.value)" style="padding:4px;"> ${p.unit||''}`
            : `<em>See milestone list</em>`}
        </td>
        <td>
            <select class="status-badge" onchange="updateStatus('${p.id}', this.value)">
                <option value="pending" ${p.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="in_progress" ${p.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${p.status === 'completed' ? 'selected' : ''}>Completed</option>
            </select>
        </td>
      </tr>
    `).join('');
  } catch(e) { console.error(e); }
}

async function updatePlan(id, val) {
  await fetch(`${SUPA_URL}/rest/v1/quarterly_plans?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json', Authorization: 'Bearer ' + SUPA_KEY },
    body: JSON.stringify({ target_value: val })
  });
}

async function updateStatus(id, status) {
  await fetch(`${SUPA_URL}/rest/v1/quarterly_plans?id=eq.${id}`, {
    method: 'PATCH',
    headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json', Authorization: 'Bearer ' + SUPA_KEY },
    body: JSON.stringify({ status: status })
  });
}

loadPlans();
</script>
</body>
</html>
